name: Database backup

# Atlas does not snapshot free clusters, so the dump comes from here instead.
# Runs daily and keeps a month of history in a private R2 bucket — both the
# runner minutes and the storage sit inside the free allowances.
on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC daily, off the hour to avoid the rush
  workflow_dispatch: # and on demand, from the Actions tab

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install MongoDB database tools
        run: |
          set -euo pipefail
          curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/mongodb.gpg
          echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq mongodb-database-tools
          mongodump --version | head -1

      - name: Dump the database
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%d)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # A single gzipped archive rather than a directory tree: one object to
          # upload, one to restore from.
          mongodump --uri="$DATABASE_URI" --archive="backup-$STAMP.gz" --gzip --quiet
          ls -lh "backup-$STAMP.gz"

      - name: Refuse to upload an empty dump
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s "backup-$STAMP.gz")
          echo "archive is $SIZE bytes"
          # A dump that fails silently produces a tiny file. Better to fail the
          # run loudly than to overwrite good history with an empty archive.
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::Dump is only $SIZE bytes — treating as a failed backup."
            exit 1
          fi

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          aws s3 cp "backup-$STAMP.gz" \
            "s3://${{ secrets.R2_BACKUP_BUCKET }}/backup-$STAMP.gz" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"
          echo "uploaded backup-$STAMP.gz"

      - name: Delete backups older than 30 days
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '30 days ago' +%Y-%m-%d)
          echo "removing anything dated before $CUTOFF"
          aws s3 ls "s3://${{ secrets.R2_BACKUP_BUCKET }}/" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            | awk '{print $4}' | grep -E '^backup-[0-9]{4}-[0-9]{2}-[0-9]{2}\.gz$' \
            | while read -r key; do
                DATE="${key#backup-}"; DATE="${DATE%.gz}"
                if [[ "$DATE" < "$CUTOFF" ]]; then
                  aws s3 rm "s3://${{ secrets.R2_BACKUP_BUCKET }}/$key" \
                    --endpoint-url "${{ secrets.R2_ENDPOINT }}"
                fi
              done
          echo "backups now held:"
          aws s3 ls "s3://${{ secrets.R2_BACKUP_BUCKET }}/" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}"
